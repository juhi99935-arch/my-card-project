<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pinterest Image Gallery</title>

<style>
* {
    margin: 10px;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    padding: 20px;
}

.gallery {
    columns: 2;
    column-gap: 15px;
}

.gallery img {
    width: 100%;
    height: auto;
    display: block;
    margin-bottom: 15px;
    border-radius: 15px;
    border: 1px solid #ddd;
    break-inside: avoid;
    transition: transform 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.03);
}

@media (max-width: 1000px) {
    .gallery {
        columns: 3;
    }
}

@media (max-width: 600px) {
    .gallery {
        columns: 2;
    }
}
</style>
</head>
