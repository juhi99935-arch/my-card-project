<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  ul{
    display: flex;
    text-align: center;
  }
</style>
<body>
  <ul style="text-align: center;">
    <li style="margin: 20px;">Arrow puzzle Game</li>
    <li style="margin: 20px;">Score:1250</li>
    <li style="margin: 20px;">Timer:01:32</li>
    <li style="margin: 20px;">Level:4</li>
  </ul>
  <div class="container" style="text-align: center;">
   <p>Puzzle-level 4</p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5veO0m6NLzPFdCOfw7UPe51ZqFXrntiYo4TVgafJzTNggvsXraMRb5ac&s=10" style="width: 500px;">
  </div>
  <div class="ro" style="text-align: center;">
    <button style="background-color: purple; padding: 15px; font-size: 20px;">Rotate</button>
    <button style="font-size: 20px; padding: 10px;">Reset</button>
    <button  style="font-size: 20px; padding: 10px;">Hint</button>
    <button style="background-color: purple; padding: 10px; font-size: 20px;">Next level</button>
  </div>
  <div class="click" style="text-align: center; margin: 20px;">
    <button style="background-color: plum; padding: 10px; font-size: 20px;">Click any arrow to rotate it, make all arrows point in same direction to win</button>
  </div>
   <div class="Tip" style="text-align: center;">
    <p>Tip:Use Hint if you get stuck!. Progress saves automatically</p>
   </div>

</body>
</html>
