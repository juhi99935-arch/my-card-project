<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  ul{
    display: flex;
    text-align: center;
  }
  .container{
    display: flex;
    text-align: center;
  }
</style>
<body>
  <div class="container" style="text-align: center; border-radius: 2px; border-style: solid; border-width: 2px; background-color: bisque;">
    <p style="margin: 30px;">Arrow puzzle Game</p>
    <p style="margin: 30px;">Score:1250</p>
    <p style="margin: 30px;">8</p>
  <p style="margin: 30px;"><span class="countdown font-mono text-2xl">
  <span style="--value:10;" aria-live="polite" aria-label="10">8</span>
  :
  <span style="--value:24; --digits: 2;" aria-live="polite" aria-label="24">20</span>
  :
  <span style="--value:59; --digits: 2;" aria-live="polite" aria-label="59">59</span>
</span>
    </p>
    
    <p style="margin: 30px;">Level:4</p>
  </div>
  <div class="hello" style="text-align: center; margin: 70px;">
   <p>Puzzle-level 4</p>
    <img src="C:\Users\hp\Pictures\puzzle.jpg.jpeg" style="width: 500px;">
  </div>
  <div class="ro" style="text-align: center;">
    <button style="background-color: purple; padding: 10px; font-size: 20px; color: white;">Rotate</button>
    <button style="font-size: 20px; padding: 10px; background-color: purple; color: white;">Reset</button>
    <button  style="font-size: 20px; padding: 10px; background-color: purple; color: white;">Hint</button>
    <button style="background-color: purple; padding: 10px; font-size: 20px; color: white;">Next level</button>
  </div>
  <div class="click" style="text-align: center; margin: 20px;">
    <button style="background-color: plum; padding: 10px; font-size: 20px;">Click any arrow to rotate it, make all arrows point in same direction to win</button>
  </div>
   <div class="Tip" style="text-align: center;">
    <p>Tip:Use Hint if you get stuck!. Progress saves automatically</p>
   </div>

</body>
</html>
